<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <!-- remix icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- css -->
    <link rel="stylesheet" href="./css/style.css">

    <title>ShopHub</title>
</head>

<body>

    <header>
        <div class="container">
            <div class="row">
                <div class="header">
                    <div class="col-12">
                        <div class="head d-flex justify-content-between mt-3 mb-2 border-bottom ">
                            <div class="col-3 col-lg-2 col-xxl-2">
                                <div class="logo">
                                    <h3 class="fw-semibold">ShopHub</h3>
                                </div>
                            </div>
                            <div class="col-6  col-xxl-7">
                                <form class="d-flex" role="search">
                                    <input class="form-control me-2 d-none d-md-block" type="search"
                                        placeholder="Search Product" aria-label="Search " />
                                </form>
                            </div>
                            <div class="col-3  col-sm-3 col-lg-2 col-xxl-2">
                                <div class="nav-icon">
                                    <ul class="d-flex fs-4 justify-content-evenly p-0">
                                        <li><i class="ri-search-line  d-sm-block d-md-none"></i></li>
                                        <li><i class="ri-poker-hearts-line fw-light"></i></li>
                                        <li><i class="ri-user-3-line"></i></li>
                                        <li><i class="ri-shopping-cart-2-line"></i></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- nav -->
        <section>
            <div class="container">
                <div class="row">
                    <div class="navbar">
                        <div class="col-12 col-lg-8  mx-auto">
                            <div class="nav-menu">
                                <ul class="d-flex justify-content-around fw-semibold fs-6 p-0">
                                    <li>Home</li>
                                    <li>Products</li>
                                    <li>New Collection</li>
                                    <li>About</li>
                                    <li>Contact</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- hero section -->
        <section>
            <div class="container">
                <div class="row">
                    <div class="hero-sec d-flex justify-content-between align-items-center my-5 flex-wrap row-gap-3">
                        <div class="col-12 col-xl-5">
                            <div class="hero-img ratio ratio-1x1 ">
                                <img src="./images/Radiant Blue Skincare Glow.png" alt="..." class="rounded-top-circle">
                            </div>
                        </div>
                        <div class="col-12 col-xl-6 px-2 px-lg-0">
                            <div class="hero-content ">
                                <div class="hero-title">
                                    <h3 class="fw-semibold m-0">Find Your Perfect </h3>
                                    <h3 class="mb-4">Products Here</h3>
                                    <p class="fs-6 mb-4">Discover a world of exquisite products and luxurious
                                        experiences that will
                                        enhance your natural beauty and elevate your self-care routine.</p>
                                </div>
                                <div class="col-12 d-flex justify-content-between ">
                                    <div class="col-5">
                                        <img src="./images/Blue Skincare Still Life on Stone.png" alt=""
                                            class="rounded-pill w-100 h-75 overflow-hidden">
                                    </div>
                                    <div class="col-5">
                                        <img src="./images/Blue Skincare Still Life with Water Droplets.png" alt=""
                                            class="rounded-pill w-100 h-75 overflow-hidden">
                                    </div>
                                </div>
                                <div class="hero-btn d-flex gap-4 align-items-center">
                                    <h5>Shop Now</h5>
                                    <div class="hero-circle rounded-circle border d-flex align-items-center">
                                        <i class="ri-arrow-right-up-long-line mx-auto"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="w-100 h-50 bg-primary ">

            </div>
        </section>

        <!-- Product card -->
        <section>
            <div class="container">
                <div class="row">
                    <div class="products d-flex flex-wrap justify-content-between row-gap-4 ">

                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./app.js"></script>
</body>

</html>
